[package]
name = "noterip"
version = "0.2.0"
description = "NoteRip - Personal Knowledge Base & Architecture Studio"
authors = ["NoteRip"]
license = "MIT"
repository = "https://github.com/oxiys/NoteRip"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "noterip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
walkdir = "2.5"
rfd = "0.15"
chrono = { version = "0.4", features = ["serde"] }

